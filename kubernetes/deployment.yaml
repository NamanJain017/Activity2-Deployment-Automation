apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopease
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shopease
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: shopease
    spec:
      containers:
        - name: shopease
          image: shopease:v1
          imagePullPolicy: IfNotPresent
          env:
            - name: APP_VERSION
              value: "1.0"
          ports:
            - name: http
              containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: shopease
spec:
  type: NodePort
  selector:
    app: shopease
  ports:
    - port: 80
      targetPort: 5000
      nodePort: 30082
