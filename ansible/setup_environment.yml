---
- name: Configure ShopEase deployment environment
  hosts: localhost
  connection: local
  become: true
  gather_facts: true

  tasks:
    - name: Update Ubuntu package index
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install deployment prerequisites
      ansible.builtin.apt:
        name:
          - git
          - curl
          - ca-certificates
          - python3
          - python3-pip
          - python3-venv
        state: present

    - name: Create ShopEase deployment workspace
      ansible.builtin.file:
        path: /home/jainn/shopease-deployment
        state: directory
        owner: jainn
        group: jainn
        mode: '0755'

    - name: Verify Python installation
      ansible.builtin.command: python3 --version
      register: python_version
      changed_when: false

    - name: Verify Git installation
      ansible.builtin.command: git --version
      register: git_version
      changed_when: false

    - name: Display configured tool versions
      ansible.builtin.debug:
        msg:
          - "{{ python_version.stdout }}"
          - "{{ git_version.stdout }}"
          - "ShopEase deployment workspace is ready."
